<style>
:root {
  --jade-bg: #f7f9f8;
  --jade-panel: #ffffff;
  --jade-ink: #17211e;
  --jade-muted: #59645f;
  --jade-line: #dce3df;
  --jade-accent: #0f766e;
  --jade-accent-soft: #eaf4f2;
  --jade-warm: #b5533c;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--jade-bg) !important;
  color: var(--jade-ink) !important;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
  font-size: 16px;
  line-height: 1.6;
}
h1, h2, h3 { color: var(--jade-ink) !important; letter-spacing: 0 !important; }
a { color: inherit !important; text-decoration: none !important; }
nav, header {
  background: rgba(247, 249, 248, .95) !important;
  border-bottom: 1px solid var(--jade-line) !important;
  box-shadow: none !important;
  backdrop-filter: blur(14px);
}
nav a, header a { color: var(--jade-ink) !important; font-size: 14px; font-weight: 600 !important; letter-spacing: 0 !important; }
footer, .page-footer, .site-footer { display: none !important; }
.article-metadata, .page-subtitle, time, .reading-time, .lastmod, .date, .post-date, .hb-article-meta, .article-date, .metadata, .pub-list-item .text-muted, .share-box, .article-tags, .page-date, .updated { display: none !important; }
.max-w-prose:has(#share-link-x),
section:has(> #share-link-x),
#share-link-x,
#share-link-facebook,
#share-link-email,
#share-link-linkedin,
#share-link-whatsapp { display: none !important; }
.prose, .article-style { max-width: none !important; }
.hbb-section.blox-_ > div {
  width: 100% !important;
  max-width: none !important;
  padding-inline: 0 !important;
  gap: 0 !important;
}
.hbb-section.blox-_ > div > .prose { width: 100% !important; }
.hbb-section.blox-_:has(.jade-hero) { padding-block: 0 !important; }
.page-body:has(.jade-page-head) { margin-block: 0 !important; }
.mx-auto.flex:has(.jade-page-head) { max-width: none !important; }
.mx-auto.flex:has(.jade-page-head) > .hb-sidebar-container,
.mx-auto.flex:has(.jade-page-head) > .hb-toc { display: none !important; }
article:has(.jade-page-head) { width: 100% !important; padding: 0 !important; }
main:has(.jade-page-head) { width: 100% !important; max-width: none !important; padding: 0 !important; }
main:has(.jade-page-head) > :not(.prose) { display: none !important; }
main:has(.jade-page-head) > .prose { width: 100% !important; }
div:has(> article .jade-page-head) > article:not(:has(.jade-page-head)) { display: none !important; }
article:has(.jade-page-head) > h1 { display: none !important; }

.jade-wrap { width: min(100%, 1160px); margin: 0 auto; padding-inline: 30px; }
.jade-narrow { max-width: 940px; }
.jade-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  gap: 54px;
  align-items: start;
  padding-top: 76px;
  padding-bottom: 66px;
}
.jade-hero-copy { max-width: 850px; }
.jade-kicker, .jade-mini {
  color: var(--jade-accent);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.jade-kicker { margin-bottom: 23px; }
.jade-title {
  max-width: none;
  margin: 0 0 27px !important;
  font-family: Georgia, "Times New Roman", serif !important;
  font-size: 72px !important;
  font-weight: 400 !important;
  line-height: 1 !important;
}
.jade-subtitle {
  max-width: 790px;
  margin: 0 0 20px;
  color: var(--jade-ink);
  font-size: 27px;
  font-weight: 560;
  line-height: 1.28;
}
.jade-desc { max-width: 790px; margin: 0; color: var(--jade-muted); font-size: 18px; line-height: 1.72; }
.jade-buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; margin-top: 30px; }
.jade-btn {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 10px 17px;
  border: 1px solid var(--jade-ink);
  border-radius: 4px;
  background: var(--jade-ink);
  color: #fff !important;
  font-size: 14px;
  font-weight: 700;
  transition: background .18s ease, border-color .18s ease;
}
.jade-btn:hover { background: var(--jade-accent); border-color: var(--jade-accent); }
.jade-text-link { display: inline-flex; align-items: center; gap: 7px; color: var(--jade-ink) !important; font-size: 15px; font-weight: 700; border-bottom: 1px solid var(--jade-ink); }
.jade-text-link:hover { color: var(--jade-accent) !important; border-color: var(--jade-accent); }
.jade-portrait-block { width: 270px; margin: 43px 0 0; }
.jade-portrait { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--jade-line); border-radius: 6px; }
.jade-portrait-block figcaption { margin-top: 13px; color: var(--jade-muted); font-size: 13px; line-height: 1.5; }

.jade-section { padding: 84px 0; border-top: 1px solid var(--jade-line); }
.jade-intro { background: var(--jade-panel); }
.jade-split { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 96px; }
.jade-mini { margin-bottom: 16px; }
.jade-section-title {
  max-width: 780px;
  margin: 0 !important;
  font-family: Georgia, "Times New Roman", serif !important;
  font-size: 50px !important;
  font-weight: 400 !important;
  line-height: 1.12 !important;
}
.jade-section-lead { max-width: 760px; margin: 22px 0 29px; color: var(--jade-muted); font-size: 19px; line-height: 1.68; }
.jade-bio p { margin: 0 0 22px; color: var(--jade-muted); font-size: 18px; line-height: 1.78; }
.jade-bio p:first-child { color: var(--jade-ink); font-size: 20px; }
.jade-agenda { background: #f1f6f5; }
.jade-agenda .jade-section-title { margin-bottom: 44px !important; }
.jade-agenda-lead { max-width: 760px; margin: -22px 0 44px; color: var(--jade-muted); font-size: 18px; line-height: 1.7; }
.jade-focus-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px; }
.jade-focus { padding-top: 20px; border-top: 2px solid var(--jade-ink); }
.jade-focus span { color: var(--jade-warm); font-size: 13px; font-weight: 800; }
.jade-focus h3 { margin: 27px 0 12px !important; font-size: 23px !important; font-weight: 700 !important; }
.jade-focus p { margin: 0; color: var(--jade-muted); font-size: 16px; line-height: 1.65; }
.jade-experience { align-items: start; }
.jade-list { border-top: 1px solid var(--jade-ink); }
.jade-list-item { display: grid; grid-template-columns: 105px 1fr; gap: 22px; padding: 21px 0; border-bottom: 1px solid var(--jade-line); }
.jade-list-item > span { color: var(--jade-accent); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; }
.jade-list-item strong { font-size: 17px; }
.jade-list-item p { margin: 4px 0 0; color: var(--jade-muted); }
.jade-recognition { background: var(--jade-panel); }
.jade-recognition-list { border-top: 1px solid var(--jade-ink); }
.jade-recognition-list article { display: grid; grid-template-columns: 105px 1fr; gap: 22px; padding: 24px 0 26px; border-bottom: 1px solid var(--jade-line); }
.jade-recognition-list article > span { color: var(--jade-accent); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; }
.jade-recognition-list h3 { margin: 0 0 7px !important; font-size: 18px !important; font-weight: 700 !important; }
.jade-recognition-list p { margin: 0; color: var(--jade-muted); line-height: 1.65; }
.jade-recognition-list p strong { color: var(--jade-ink); }
.jade-closing { background: var(--jade-ink); border-top: 0; }
.jade-closing .jade-mini { color: #80cbc4; }
.jade-closing .jade-section-title { max-width: 820px; color: #fff !important; }
.jade-contact-links { display: flex; flex-wrap: wrap; gap: 12px 34px; margin-top: 35px; }
.jade-contact-links a { display: inline-flex; gap: 8px; color: inherit !important; font-weight: 700; border-bottom: 1px solid currentColor; }
.jade-closing .jade-contact-links { color: #fff; }

.jade-page-head { padding: 92px 0 82px; background: var(--jade-accent-soft); border-bottom: 1px solid var(--jade-line); }
.jade-page-head-inner { max-width: 980px; }
.jade-page-head .jade-section-title { max-width: 900px; font-size: 58px !important; }
.jade-page-body { background: var(--jade-panel); }
.jade-list-heading { margin: 0 0 25px !important; font-size: 15px !important; font-weight: 800 !important; text-transform: uppercase; letter-spacing: .08em !important; }
.jade-space-top { margin-top: 72px !important; }
.jade-publication { padding: 27px 0 29px; border-top: 1px solid var(--jade-line); }
.jade-publication:last-child { border-bottom: 1px solid var(--jade-line); }
.jade-publication > span, .jade-talk > span, .jade-talk-list span { color: var(--jade-accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.jade-publication h3 { max-width: 850px; margin: 9px 0 12px !important; font-family: Georgia, "Times New Roman", serif !important; font-size: 23px !important; font-weight: 400 !important; line-height: 1.36; }
.jade-publication p { margin: 4px 0; color: var(--jade-muted); font-size: 14px; line-height: 1.55; }
.jade-publication .jade-venue { color: var(--jade-ink); font-weight: 600; }
.jade-course-list { border-top: 1px solid var(--jade-ink); }
.jade-course-list article { display: grid; grid-template-columns: 120px 1fr; gap: 26px; padding: 25px 0; border-bottom: 1px solid var(--jade-line); }
.jade-course-list article > span { color: var(--jade-accent); font-size: 12px; font-weight: 800; }
.jade-course-list h3 { margin: 0 0 5px !important; font-size: 21px !important; }
.jade-course-list p { margin: 0; color: var(--jade-muted); }
.jade-mentoring { columns: 2; column-gap: 60px; }
.jade-mentoring p { break-inside: avoid; margin: 0 0 22px; color: var(--jade-muted); }
.jade-mentoring strong { color: var(--jade-ink); }
.jade-talk-featured { padding: 28px; border-left: 3px solid var(--jade-accent); border-radius: 6px; background: var(--jade-accent-soft); }
.jade-talk-featured h3 { margin: 12px 0 8px !important; font-family: Georgia, "Times New Roman", serif !important; font-size: 27px !important; font-weight: 400 !important; }
.jade-talk-featured p { margin: 0; color: var(--jade-muted); }
.jade-talk-list { border-top: 1px solid var(--jade-ink); }
.jade-talk-list article { padding: 25px 0; border-bottom: 1px solid var(--jade-line); }
.jade-talk-list h3 { max-width: 780px; margin: 8px 0 0 !important; font-family: Georgia, "Times New Roman", serif !important; font-size: 22px !important; font-weight: 400 !important; line-height: 1.4; }
.jade-talk-list p { margin: 8px 0 0; color: var(--jade-muted); font-size: 14px; }
.jade-talk-list-current article { padding-left: 18px; border-left: 3px solid var(--jade-warm); }
.jade-contact-page { min-height: calc(100vh - 70px); display: flex; align-items: center; background: var(--jade-panel); }
.jade-contact-page .jade-contact-links { color: var(--jade-ink); }
.jade-page-connect { padding: 32px 0; border-top: 1px solid var(--jade-line); background: var(--jade-bg); }
.jade-page-connect .jade-wrap { display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; }
.jade-page-connect > .jade-wrap > span { color: var(--jade-accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
.jade-page-connect .jade-wrap > div { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px 28px; }
.jade-page-connect a { color: var(--jade-ink) !important; font-size: 14px; font-weight: 700; border-bottom: 1px solid currentColor; }
.jade-page-connect a:hover { color: var(--jade-accent) !important; }

:focus-visible { outline: 3px solid #2aa198; outline-offset: 4px; }

@media (max-width: 900px) {
  .jade-wrap { padding-inline: 22px; }
  .jade-hero { grid-template-columns: 1fr; gap: 42px; padding-top: 52px; padding-bottom: 56px; }
  .jade-hero-copy { max-width: none; }
  .jade-portrait-block { order: -1; width: 164px; margin: 0; }
  .jade-portrait-block figcaption { display: none; }
  .jade-title { font-size: 54px !important; }
  .jade-subtitle { font-size: 24px; }
  .jade-split { grid-template-columns: 1fr; gap: 38px; }
  .jade-focus-grid { grid-template-columns: 1fr; gap: 34px; }
  .jade-section { padding: 65px 0; }
  .jade-page-head { padding: 64px 0 58px; }
  .jade-page-head .jade-section-title { font-size: 46px !important; }
  .jade-section-title { font-size: 42px !important; }
}

@media (max-width: 560px) {
  .jade-hero { gap: 24px; padding-top: 30px; padding-bottom: 44px; }
  .jade-portrait-block { width: 112px; }
  .jade-portrait-block figcaption { display: none; }
  .jade-title { font-size: 46px !important; }
  .jade-subtitle { font-size: 21px; }
  .jade-desc, .jade-bio p { font-size: 16px; }
  .jade-bio p:first-child { font-size: 18px; }
  .jade-section-title, .jade-page-head .jade-section-title { font-size: 37px !important; }
  .jade-list-item, .jade-course-list article, .jade-recognition-list article { grid-template-columns: 1fr; gap: 7px; }
  .jade-mentoring { columns: 1; }
  .jade-contact-links { flex-direction: column; align-items: flex-start; }
  .jade-page-connect .jade-wrap, .jade-page-connect .jade-wrap > div { flex-direction: column; align-items: flex-start; }
}
</style>
